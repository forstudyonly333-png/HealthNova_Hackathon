<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Background circular blue ring matching card 3 in screenshot -->
  <circle cx="150" cy="150" r="130" fill="#f0f9ff" stroke="#0284c7" stroke-width="6" />
  
  <g transform="translate(0, 10)">
    <!-- Lab coat / Shoulders -->
    <path d="M 65 260 C 65 210, 90 185, 118 180 L 126 215 L 174 215 L 182 180 C 210 185, 235 210, 235 260 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Teal V-neck scrubs / blouse -->
    <polygon points="126,180 174,180 150,225" fill="#0d9488" />

    <!-- Stethoscope -->
    <path d="M 115 180 C 105 210, 108 240, 130 248" fill="none" stroke="#047857" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 185 180 C 195 210, 192 238, 175 245" fill="none" stroke="#047857" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="175" cy="245" r="9" fill="#10b981" stroke="#047857" stroke-width="2.5" />

    <!-- Neck -->
    <rect x="136" y="148" width="28" height="34" fill="#fed7aa" rx="3" />
    
    <!-- Head / Face -->
    <ellipse cx="150" cy="118" rx="40" ry="46" fill="#fed7aa" />
    <!-- Ears -->
    <ellipse cx="108" cy="120" rx="6" ry="10" fill="#fed7aa" />
    <ellipse cx="192" cy="120" rx="6" ry="10" fill="#fed7aa" />
    
    <!-- Eyes -->
    <ellipse cx="136" cy="116" rx="3.5" ry="4.5" fill="#334155" />
    <ellipse cx="164" cy="116" rx="3.5" ry="4.5" fill="#334155" />
    
    <!-- Eyebrows -->
    <path d="M 129 107 Q 136 103 143 107" fill="none" stroke="#78350f" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 157 107 Q 164 103 171 107" fill="none" stroke="#78350f" stroke-width="2.2" stroke-linecap="round" />

    <!-- Soft Smile -->
    <path d="M 138 136 Q 150 146 162 136" fill="#ffffff" stroke="#78350f" stroke-width="2" stroke-linecap="round" />

    <!-- Feminine Brown Hair framing face -->
    <path d="M 102 145 C 98 100, 115 50, 150 50 C 185 50, 202 100, 198 145 C 195 130, 190 100, 185 95 C 170 95, 160 90, 150 90 C 140 90, 130 95, 115 95 C 110 100, 105 130, 102 145 Z" fill="#78350f" />
    <!-- Front hair fringe -->
    <path d="M 115 95 Q 150 78 185 95 Q 150 85 115 95 Z" fill="#92400e" />
