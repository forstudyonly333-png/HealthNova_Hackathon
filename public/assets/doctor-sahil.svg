<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Background circular teal ring matching download2.jpg -->
  <circle cx="150" cy="150" r="130" fill="#f0fdf4" stroke="#0d9488" stroke-width="6" />
  
  <g transform="translate(0, 10)">
    <!-- Body / Shoulders / Lab coat -->
    <path d="M 60 260 C 60 210, 85 180, 115 175 L 125 210 L 175 210 L 185 175 C 215 180, 240 210, 240 260 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Light blue shirt -->
    <polygon points="125,175 175,175 160,230 140,230" fill="#93c5fd" />
    
    <!-- Blue Tie -->
    <polygon points="145,185 155,185 158,225 150,245 142,225" fill="#0284c7" />

    <!-- Lab coat lapels -->
    <path d="M 95 180 L 135 250 L 115 250 Z" fill="#f8fafc" />
    <path d="M 205 180 L 165 250 L 185 250 Z" fill="#f8fafc" />
    
    <!-- Stethoscope -->
    <path d="M 115 175 C 110 210, 110 240, 128 245 C 135 248, 140 240, 138 230" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <circle cx="138" cy="225" r="7" fill="#64748b" />
    <path d="M 185 175 C 190 210, 190 235, 180 242" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <circle cx="180" cy="242" r="9" fill="#94a3b8" stroke="#334155" stroke-width="2" />

    <!-- Neck -->
    <rect x="135" y="145" width="30" height="35" fill="#fcd34d" rx="4" />
    
    <!-- Head / Face -->
    <ellipse cx="150" cy="115" rx="42" ry="48" fill="#fed7aa" />
    <!-- Ears -->
    <ellipse cx="106" cy="115" rx="8" ry="12" fill="#fed7aa" />
    <ellipse cx="194" cy="115" rx="8" ry="12" fill="#fed7aa" />
    
    <!-- Eyes -->
    <ellipse cx="136" cy="112" rx="4" ry="5" fill="#334155" />
    <ellipse cx="164" cy="112" rx="4" ry="5" fill="#334155" />
    
    <!-- Eyebrows -->
    <path d="M 128 102 Q 136 98 144 102" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 156 102 Q 164 98 172 102" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M 150 114 Q 153 124 148 126" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" />

    <!-- Smile -->
    <path d="M 137 132 Q 150 144 163 132" fill="#ffffff" stroke="#78350f" stroke-width="2" stroke-linecap="round" />

    <!-- Brown Hair -->
    <path d="M 108 105 C 105 70, 125 50, 150 50 C 175 50, 195 70, 192 105 C 188 95, 180 85, 170 85 C 158 85, 150 92, 140 88 C 130 84, 120 95, 108 105 Z" fill="#78350f" />
    <!-- Hair fringe tuft -->
    <path d="M 125 80 Q 150 65 175 75 Q 155 60 135 68 Z" fill="#92400e" />
  </g>
</svg>
