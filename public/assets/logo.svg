<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%">
  <defs>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>
  <!-- Retained Emblem on the left -->
  <g transform="translate(15, 10) scale(0.95)" filter="url(#subtle-shadow)">
    <!-- 4 figures orbiting the cross -->
    <!-- Top figure (Navy) -->
    <circle cx="55" cy="18" r="8" fill="#1e3a8a" />
    <path d="M 32 36 C 45 23, 65 23, 78 36 C 68 34, 42 34, 32 36 Z" fill="#1e3a8a" />

    <!-- Right figure (Orange) -->
    <circle cx="92" cy="55" r="8" fill="#ea580c" />
    <path d="M 74 32 C 87 45, 87 65, 74 78 C 76 68, 76 42, 74 32 Z" fill="#ea580c" />

    <!-- Bottom figure (Purple) -->
    <circle cx="55" cy="92" r="8" fill="#581c87" />
    <path d="M 78 74 C 65 87, 45 87, 32 74 C 42 76, 68 76, 78 74 Z" fill="#581c87" />

    <!-- Left figure (Red) -->
    <circle cx="18" cy="55" r="8" fill="#b91c1c" />
    <path d="M 36 78 C 23 65, 23 45, 36 32 C 34 42, 34 68, 36 78 Z" fill="#b91c1c" />

    <!-- Central Medical Cross -->
    <rect x="47" y="32" width="16" height="46" rx="3" fill="#15803d" />
    <rect x="32" y="47" width="46" height="16" rx="3" fill="#15803d" />
  </g>

  <!-- Brand Wordmark: Going Home Right -->
  <text x="135" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Going Home <tspan fill="#10b981">Right</tspan></text>
  <text x="136" y="82" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="0.5">TEAM HEALTHNOVA · DISCHARGE SAFETY</text>
</svg>
