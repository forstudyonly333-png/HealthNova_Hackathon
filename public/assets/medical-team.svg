<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="scrub-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="soft-depth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Clean modern hospital clinic background -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />

  <!-- Architectural subtle clinical bokeh & glass partitions -->
  <circle cx="200" cy="180" r="160" fill="#bae6fd" opacity="0.3" filter="blur(30px)" />
  <circle cx="850" cy="220" r="220" fill="#bbf7d0" opacity="0.25" filter="blur(40px)" />
  <circle cx="1050" cy="120" r="140" fill="#e0e7ff" opacity="0.3" filter="blur(25px)" />
  <rect x="0" y="380" width="1200" height="295" fill="#f1f5f9" opacity="0.4" />
  <line x1="0" y1="380" x2="1200" y2="380" stroke="#cbd5e1" stroke-width="1.5" opacity="0.5" />

  <!-- Medical Team Group -->
  <g id="medical-team-group" transform="translate(100, 20)" filter="url(#soft-depth)">

    <!-- 1. Center-Back Left: Doctor with Glasses (Male) -->
    <g transform="translate(320, 80)">
      <!-- Coat -->
      <path d="M 40 400 C 40 260, 80 210, 140 200 L 155 240 L 225 240 L 240 200 C 300 210, 340 260, 340 400 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
      <polygon points="150,200 230,200 210,270 170,270" fill="#f1f5f9" />
      <polygon points="180,210 200,210 205,260 190,290 175,260" fill="#0f172a" /> <!-- black tie -->
      <!-- Stethoscope red tubes -->
      <path d="M 135 200 C 115 250, 120 290, 150 300" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round" />
      <path d="M 245 200 C 265 250, 260 290, 230 300" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round" />
      <!-- Head -->
      <ellipse cx="190" cy="130" rx="46" ry="54" fill="#fed7aa" />
      <!-- Short dark hair and neat beard -->
      <path d="M 144 140 C 140 80, 160 55, 190 55 C 220 55, 240 80, 236 140 C 230 110, 210 95, 190 95 C 170 95, 150 110, 144 140 Z" fill="#1e293b" />
      <path d="M 160 160 C 170 178, 210 178, 220 160" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" opacity="0.6" />
      <!-- Glasses -->
      <rect x="156" y="116" width="28" height="20" rx="4" fill="none" stroke="#0f172a" stroke-width="3.5" />
      <rect x="196" y="116" width="28" height="20" rx="4" fill="none" stroke="#0f172a" stroke-width="3.5" />
      <line x1="184" y1="125" x2="196" y2="125" stroke="#0f172a" stroke-width="3" />
      <circle cx="170" cy="126" r="3" fill="#0f172a" />
      <circle cx="210" cy="126" r="3" fill="#0f172a" />
    </g>

    <!-- 2. Center-Back Right: Blonde Senior Female Doctor -->
    <g transform="translate(560, 40)">
      <!-- Coat -->
      <path d="M 30 450 C 30 290, 80 230, 150 220 L 165 260 L 235 260 L 250 220 C 320 230, 370 290, 370 450 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
      <!-- Teal inner top -->
      <polygon points="160,220 240,220 200,280" fill="#0284c7" />
      <!-- Stethoscope -->
      <path d="M 145 220 C 130 270, 140 320, 180 330" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" />
      <path d="M 255 220 C 270 270, 260 320, 220 330" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" />
      <circle cx="200" cy="330" r="10" fill="#94a3b8" />
      <!-- Head -->
      <ellipse cx="200" cy="135" rx="46" ry="54" fill="#fde68a" />
      <!-- Blonde Hair -->
      <path d="M 148 160 C 145 70, 175 50, 200 50 C 235 50, 255 70, 252 160 C 245 130, 230 100, 200 100 C 170 100, 155 130, 148 160 Z" fill="#fbbf24" />
      <path d="M 160 100 Q 200 80 240 105" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
      <!-- Face details -->
      <ellipse cx="184" cy="132" rx="3.5" ry="4.5" fill="#334155" />
      <ellipse cx="216" cy="132" rx="3.5" ry="4.5" fill="#334155" />
      <path d="M 186 155 Q 200 166 214 155" fill="#ffffff" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- 3. Left-Front: Female Nurse / Doctor in Blue Scrubs -->
    <g transform="translate(180, 220)">
      <!-- Scrubs -->
      <path d="M 20 380 C 20 260, 60 210, 130 195 L 140 235 L 200 235 L 210 195 C 280 210, 320 260, 320 380 Z" fill="url(#scrub-blue)" />
      <!-- Crossed arms in scrubs -->
      <path d="M 50 330 C 90 300, 200 300, 280 330 C 260 360, 80 360, 50 330 Z" fill="#0369a1" />
      <!-- Head -->
      <ellipse cx="170" cy="120" rx="40" ry="48" fill="#fed7aa" />
      <!-- Light Brown Hair tied back -->
      <path d="M 126 130 C 125 65, 145 50, 170 50 C 195 50, 215 65, 214 130 C 205 105, 190 90, 170 90 C 150 90, 135 105, 126 130 Z" fill="#b45309" />
      <ellipse cx="156" cy="116" rx="3.5" ry="4" fill="#334155" />
      <ellipse cx="184" cy="116" rx="3.5" ry="4" fill="#334155" />
      <path d="M 158 138 Q 170 146 182 138" fill="#ffffff" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- 4. Center-Front: Young Male Doctor in White Coat with Yellow Stethoscope -->
    <g transform="translate(360, 180)">
      <!-- Lab coat -->
      <path d="M 20 420 C 20 270, 70 210, 150 200 L 165 245 L 235 245 L 250 200 C 330 210, 380 270, 380 420 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" />
      <polygon points="160,200 240,200 200,270" fill="#f8fafc" />
      <!-- Yellow Stethoscope (as in photo) -->
      <path d="M 140 200 C 120 250, 130 300, 170 310" fill="none" stroke="#eab308" stroke-width="6" stroke-linecap="round" />
      <path d="M 260 200 C 280 250, 270 300, 230 310" fill="none" stroke="#eab308" stroke-width="6" stroke-linecap="round" />
      <circle cx="200" cy="310" r="10" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
      <!-- Arms crossed -->
      <path d="M 70 340 C 110 320, 290 320, 330 340 L 310 380 L 90 380 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Head -->
      <ellipse cx="200" cy="120" rx="42" ry="50" fill="#fcd34d" />
      <!-- Dark hair & gentle smile -->
      <path d="M 155 130 C 150 70, 175 45, 200 45 C 225 45, 245 70, 242 130 C 235 105, 215 85, 200 85 C 185 85, 165 105, 155 130 Z" fill="#1e293b" />
      <ellipse cx="185" cy="115" rx="3.5" ry="4" fill="#334155" />
      <ellipse cx="215" cy="115" rx="3.5" ry="4" fill="#334155" />
      <path d="M 188 140 Q 200 150 212 140" fill="#ffffff" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- 5. Front Right-Center: Nurse/Doctor in Blue Scrubs holding Digital Tablet -->
    <g transform="translate(560, 210)">
      <!-- Blue Scrubs -->
      <path d="M 20 390 C 20 270, 60 210, 130 195 L 140 235 L 200 235 L 210 195 C 280 210, 320 270, 320 390 Z" fill="url(#scrub-blue)" />
      <!-- Digital Medical Tablet held in hands -->
      <rect x="90" y="300" width="85" height="110" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="3" />
      <rect x="98" y="310" width="69" height="70" rx="3" fill="#bae6fd" />
      <line x1="104" y1="322" x2="140" y2="322" stroke="#0284c7" stroke-width="2" />
      <line x1="104" y1="332" x2="155" y2="332" stroke="#0284c7" stroke-width="2" />
      <line x1="104" y1="342" x2="130" y2="342" stroke="#0284c7" stroke-width="2" />
      <!-- Head -->
      <ellipse cx="170" cy="118" rx="38" ry="46" fill="#fde68a" />
      <!-- Dark hair -->
      <path d="M 128 140 C 125 70, 150 48, 170 48 C 195 48, 212 70, 210 140 C 202 110, 185 92, 170 92 C 150 92, 138 110, 128 140 Z" fill="#0f172a" />
      <ellipse cx="156" cy="114" rx="3.5" ry="4" fill="#334155" />
      <ellipse cx="184" cy="114" rx="3.5" ry="4" fill="#334155" />
      <path d="M 158 135 Q 170 144 182 135" fill="#ffffff" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- 6. Right-Front: Senior Doctor with Grey Hair and Stethoscope -->
    <g transform="translate(740, 190)">
      <!-- White coat -->
      <path d="M 20 410 C 20 270, 60 215, 140 200 L 155 245 L 225 245 L 240 200 C 315 215, 360 270, 360 410 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
      <polygon points="150,200 230,200 190,265" fill="#f8fafc" />
      <!-- Blue Stethoscope with silver chestpiece -->
      <path d="M 130 200 C 110 250, 115 300, 150 310" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
      <path d="M 250 200 C 270 250, 260 300, 220 310" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
      <circle cx="185" cy="310" r="10" fill="#94a3b8" stroke="#334155" stroke-width="2" />
      <!-- Watch on wrist -->
      <rect x="270" y="370" width="14" height="22" rx="3" fill="#0f172a" />
      <!-- Head -->
      <ellipse cx="190" cy="120" rx="42" ry="50" fill="#fed7aa" />
      <!-- Grey hair & neat grey beard -->
      <path d="M 145 130 C 140 70, 165 48, 190 48 C 215 48, 238 70, 234 130 C 228 105, 210 90, 190 90 C 170 90, 152 105, 145 130 Z" fill="#94a3b8" />
      <path d="M 160 148 C 170 172, 210 172, 220 148 C 215 160, 165 160, 160 148 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
      <ellipse cx="174" cy="115" rx="3.5" ry="4" fill="#334155" />
      <ellipse cx="206" cy="115" rx="3.5" ry="4" fill="#334155" />
      <path d="M 176 138 Q 190 146 204 138" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    </g>

  </g>
</svg>
