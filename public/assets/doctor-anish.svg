<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Background circular warm ring -->
  <circle cx="150" cy="150" r="130" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4" />
  
  <g transform="translate(0, 10)">
    <!-- Lab coat & Shoulders -->
    <path d="M 55 260 C 55 205, 80 180, 115 175 L 125 210 L 175 210 L 185 175 C 220 180, 245 205, 245 260 Z" fill="#e2e8f0" />
    
    <!-- Inner cyan/blue shirt -->
    <polygon points="120,175 180,175 165,240 135,240" fill="#0284c7" />
    
    <!-- Red Tie -->
    <polygon points="144,185 156,185 160,235 150,255 140,235" fill="#ef4444" />

    <!-- White coat lapels -->
    <path d="M 90 180 L 138 255 L 115 255 Z" fill="#ffffff" />
    <path d="M 210 180 L 162 255 L 185 255 Z" fill="#ffffff" />
    
    <!-- Green/cyan Stethoscope -->
    <path d="M 110 175 C 95 210, 95 240, 120 248 C 130 252, 138 245, 138 235" fill="none" stroke="#0d9488" stroke-width="5" stroke-linecap="round" />
    <path d="M 190 175 C 205 210, 205 240, 185 248" fill="none" stroke="#0d9488" stroke-width="5" stroke-linecap="round" />
    <circle cx="185" cy="248" r="10" fill="#14b8a6" stroke="#0f766e" stroke-width="3" />
    <!-- Stethoscope earpieces -->
    <circle cx="110" cy="175" r="4" fill="#334155" />
    <circle cx="190" cy="175" r="4" fill="#334155" />

    <!-- Neck -->
    <rect x="135" y="145" width="30" height="35" fill="#facc15" rx="3" />
    
    <!-- Head / Face (yellow tone as in download.jpg) -->
    <ellipse cx="150" cy="115" rx="44" ry="50" fill="#facc15" />
    <!-- Ears -->
    <ellipse cx="104" cy="118" rx="8" ry="12" fill="#facc15" />
    <ellipse cx="196" cy="118" rx="8" ry="12" fill="#facc15" />

    <!-- Dark Hair and sideburns -->
    <path d="M 106 125 L 110 100 C 110 65, 130 45, 150 45 C 170 45, 190 65, 190 100 L 194 125 C 188 120, 184 105, 180 95 C 170 95, 160 100, 150 95 C 140 100, 130 95, 120 95 C 116 105, 112 120, 106 125 Z" fill="#334155" />
  </g>
</svg>
